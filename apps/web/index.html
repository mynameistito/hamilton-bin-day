<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171d19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hamilton Bin Day" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Find your next Hamilton bin collection day."
    />
    <title>Hamilton Bin Day</title>
    <script>
      try {
        const themeKey = "hamilton-bin-day-theme";
        const legacyThemeKey = "hcc-bin-day-theme";
        const currentTheme = localStorage.getItem(themeKey);
        const legacyTheme = localStorage.getItem(legacyThemeKey);
        const theme = currentTheme ?? legacyTheme;
        if (currentTheme === null && legacyTheme !== null) {
          try {
            localStorage.setItem(themeKey, legacyTheme);
          } catch {
            // Apply the saved theme even when migration storage is full.
          }
        }
        try {
          localStorage.removeItem(legacyThemeKey);
        } catch {
          // Apply the selected theme even if legacy cleanup fails.
        }
        document.documentElement.dataset.theme =
          theme === "light" ? "light" : "dark";
        document.querySelector('meta[name="theme-color"]').content =
          theme === "light" ? "#f7f6f2" : "#171d19";
      } catch {
        document.documentElement.dataset.theme = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#171d19";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

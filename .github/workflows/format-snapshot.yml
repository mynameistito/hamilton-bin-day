name: Temporary formatter snapshot

on:
  push:
    branches:
      - feat/issue-47-bin-help

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format the affected files
        run: >-
          bunx ultracite fix
          apps/web/scripts/sync-hcc-bin-items.ts
          apps/web/src/components/bin-help.tsx
          apps/web/src/lib/__tests__/bin-items-sync.test.ts
          apps/web/src/lib/__tests__/bin-items.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatter-snapshot
          path: |
            apps/web/scripts/sync-hcc-bin-items.ts
            apps/web/src/components/bin-help.tsx
            apps/web/src/lib/__tests__/bin-items-sync.test.ts
            apps/web/src/lib/__tests__/bin-items.test.ts
          if-no-files-found: error

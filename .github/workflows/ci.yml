name: CI (artifact)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - check
          - test
          - build
          - knip
    name: ${{ matrix.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run task
        run: bun run ${{ matrix.task }}

      - name: Bundle Worker Preview artifact
        if: matrix.task == 'build'
        run: |
          mkdir -p "$RUNNER_TEMP/alchemy-worker/worker" "$RUNNER_TEMP/alchemy-worker/site"
          bun build apps/web/src/worker.ts --target browser --outfile "$RUNNER_TEMP/alchemy-worker/worker/index.js"
          cp -R apps/web/dist/. "$RUNNER_TEMP/alchemy-worker/site/"

      - name: Upload Worker Preview artifact
        if: matrix.task == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alchemy-worker
          path: ${{ runner.temp }}/alchemy-worker/
          if-no-files-found: error

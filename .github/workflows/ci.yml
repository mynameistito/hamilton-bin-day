name: CI (artifact)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - typecheck
          - check
          - test
          - build
          - knip
    name: ${{ matrix.task }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run task
        run: bun run ${{ matrix.task }}

      - name: Bundle Worker Preview artifact
        if: matrix.task == 'build'
        run: |
          mkdir -p "$RUNNER_TEMP/alchemy-worker/worker" "$RUNNER_TEMP/alchemy-worker/site"
          bun build apps/web/src/worker.ts --target browser --outfile "$RUNNER_TEMP/alchemy-worker/worker/index.js"
          cp -R apps/web/dist/. "$RUNNER_TEMP/alchemy-worker/site/"

      - name: Upload Worker Preview artifact
        if: matrix.task == 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alchemy-worker
          path: ${{ runner.temp }}/alchemy-worker/
          if-no-files-found: error
